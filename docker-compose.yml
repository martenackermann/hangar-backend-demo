# Self-contained demo stack: API + worker + PostgreSQL 17 + Mailpit.
#   docker compose up --build
#   API      http://localhost:8100/api/v1/docs   (login: dana.dispatcher@example.com / demo1234)
#   Mailpit  http://localhost:8025
# Demo credentials/secrets below are placeholders for local use only. Ports are published on
# 127.0.0.1 (HANGAR_BIND_ADDRESS); override API_PORT / MAILPIT_UI_PORT if 8100/8025 are taken.
# With DEMO_MODE=false the API refuses these placeholder secrets: set JWT_SECRET and
# FILE_URL_SIGNING_KEY (32+ random characters each).

name: hangar

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://hangar:hangar@postgres:5432/hangar
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAILPIT_URL: ${MAILPIT_URL:-http://localhost:${MAILPIT_UI_PORT:-8025}}
  JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-change-me-0123456789}
  FILE_URL_SIGNING_KEY: ${FILE_URL_SIGNING_KEY:-demo-only-file-signing-key-change-me}
  HANGAR_PUBLIC_API_URL: ${HANGAR_PUBLIC_API_URL:-http://localhost:${API_PORT:-8100}/api/v1}
  HANGAR_BUSINESS_TZ: ${HANGAR_BUSINESS_TZ:-Europe/Zurich}
  HANGAR_CORS_ORIGINS: ${HANGAR_CORS_ORIGINS:-http://localhost:5173}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  DEMO_MODE: ${DEMO_MODE:-true}
  DEMO_NIGHTLY_RESET: ${DEMO_NIGHTLY_RESET:-false}
  ENVIRONMENT: production
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hangar
      POSTGRES_PASSWORD: hangar
      POSTGRES_DB: hangar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangar -d hangar"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${HANGAR_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build: .
    image: ${HANGAR_IMAGE:-hangar-backend-demo:local}
    environment:
      <<: *app-env
    # Migrations, then the idempotent demo seed (demo mode only), then the server.
    command:
      - sh
      - -c
      - >-
        hangar db upgrade &&
        if [ "$${DEMO_MODE}" != "false" ]; then hangar seed; fi &&
        exec hangar serve
    ports:
      - "${HANGAR_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8100}:8100"
    volumes:
      - files:/app/var/files
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    image: ${HANGAR_IMAGE:-hangar-backend-demo:local}
    pull_policy: never
    environment:
      <<: *app-env
    command: ["hangar", "worker"]
    volumes:
      - files:/app/var/files
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  files:
